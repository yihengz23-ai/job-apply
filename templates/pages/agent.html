{# 右下角助手：按钮 + 对话框，脚本是 static/js/agent.js #}
<button id="agentFab" class="px-4 py-3 rounded-full bg-slate-900 text-white shadow-2xl flex items-center gap-2 text-sm font-bold"><span class="material-symbols-outlined">smart_toy</span><span id="agentFabLabel">助手</span></button>
<aside id="agentDrawer" class="bg-white shadow-2xl border-l flex flex-col">
  <div class="flex items-center gap-2 px-4 py-3 border-b">
    <span class="material-symbols-outlined text-teal-600">smart_toy</span>
    <select id="agentChats" class="text-sm bg-slate-100 border-none rounded-lg py-1 pl-2 pr-7 min-w-0 flex-1"></select>
    <button id="agentNew" class="copy-btn !py-1.5 shrink-0">+ 新对话</button>
    <button id="agentClose" class="text-slate-400 hover:text-slate-700 shrink-0" title="收起（它会接着做）"><span class="material-symbols-outlined">close</span></button>
  </div>
  <p class="px-4 py-2 text-[11px] text-slate-500 bg-slate-50 border-b">它能操作你的 Chrome 代填网申、回答投递的问题；不会点提交、不发邮件、不碰身份证号。登录和最后提交由你来。它干活时你随时可以说话（比如换个写法、先跳过某段），它下一步就能看到；收起这个框它也会接着做。</p>
  <div id="agentMsgs" class="flex-1 overflow-y-auto px-4 py-3 space-y-2.5 text-sm"></div>
  <div class="border-t p-3">
    <div id="agentStatus" class="hidden text-xs text-teal-700 mb-2 flex items-center gap-1"><span class="material-symbols-outlined animate-spin text-sm">progress_activity</span><span id="agentStatusText">正在做；想改什么直接说，它下一步就能看到。做完会弹通知</span>
      <button id="agentStop" class="ml-auto px-2 py-1 rounded-lg bg-red-50 text-red-600 font-bold">停止</button></div>
    <div class="flex gap-2 items-end">
      <textarea id="agentInput" rows="2" class="field flex-1 resize-none" placeholder="比如：帮我填这个网申 https://…（⌘+回车 发送）"></textarea>
      <button id="agentSend" class="px-4 py-2.5 bg-primary text-white rounded-xl text-sm font-bold">发送</button>
    </div>
  </div>
</aside>
